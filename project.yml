name: WiFiDrop
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"

targets:
  WiFiDrop:
    type: application
    platform: iOS
    sources:
      - path: WiFiDrop
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.wifidrop
        PRODUCT_NAME: WiFiDrop
        INFOPLIST_FILE: WiFiDrop/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
