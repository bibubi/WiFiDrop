name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Materialize app icon
        run: |
          mkdir -p WiFiDrop/Assets.xcassets/AppIcon.appiconset
          openssl base64 -d -A -in Artwork/AppIcon.b64 -out WiFiDrop/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project WiFiDrop.xcodeproj \
            -scheme WiFiDrop \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WiFiDrop.app Payload/
          zip -qry WiFiDrop-unsigned.ipa Payload
          ls -lh WiFiDrop-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiFiDrop-unsigned-ipa
          path: WiFiDrop-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
